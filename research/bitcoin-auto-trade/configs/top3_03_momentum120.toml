# Historical strategy-family Top 3; equivalent to extended search refine_mix_007.
# Retrospective research, with signals fixed before this reproduction.
name = "top3_03_momentum120"

[paths]
data_dir = "../data/extended"
output_root = "../reports/experiments"
cache_dir = "../.research-cache"

[[observations]]
name = "obs120"
features = [{kind="log_return",window=120},{kind="efficiency",window=120},{kind="taker_imbalance",window=120}]

[[models]]
name = "hmm"
kind = "hmm"
train_window = 365
retrain_every = 30
naming_window = 60
decode_window = 61
iterations = 100
restarts = 10
seeds = [42,137]
sticky_kappa = 0.0

[decisions]
ratios = []
include_viterbi = true

[trading]
initial_cash = 10000.0
fees = 0.0005
slippage = 0.0005
close_final = true

[evaluation]
start = "2021-04-30"
end = "2026-09-30"
prefix_bars = 100
sharpe_benchmark = "zero"

[plots]
enabled = false
dpi = 150

[selection]
enabled = false

[diagnostics]
bear_regimes = false

[[signals]]
name = "mom90"
kind = "momentum"
parameters = {lookback=90, entry_threshold=0, exit_threshold=0, trend_filter=0, short=false}

[[strategies]]
name = "momentum90_ema_flat"
bull = "mom90"
side = "ema"
bear = "flat"
ema_fast = 10
ema_slow = 30
ema_filter = 200

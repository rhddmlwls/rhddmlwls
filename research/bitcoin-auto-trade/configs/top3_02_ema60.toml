# Historical strategy-family Top 2; equivalent to extended search refine_mix_004.
# Retrospective research, with the existing EMA signal state carried across regimes.
name = "top3_02_ema60"

[paths]
data_dir = "../data/extended"
output_root = "../reports/experiments"
cache_dir = "../.research-cache"

[[observations]]
name = "obs60"
features = [{kind="log_return",window=60},{kind="efficiency",window=60},{kind="taker_imbalance",window=60}]

[[models]]
name = "hmm"
kind = "hmm"
train_window = 365
retrain_every = 30
naming_window = 60
decode_window = 61
iterations = 100
restarts = 10
seeds = [42,137]
sticky_kappa = 0.0

[decisions]
ratios = []
include_viterbi = true

[trading]
initial_cash = 10000.0
fees = 0.0005
slippage = 0.0005
close_final = true

[evaluation]
start = "2021-04-30"
end = "2026-09-30"
prefix_bars = 100
sharpe_benchmark = "zero"

[plots]
enabled = false
dpi = 150

[selection]
enabled = false

[diagnostics]
bear_regimes = false

[[strategies]]
name = "ema_ema_flat"
bull = "ema"
side = "ema"
bear = "flat"
ema_fast = 10
ema_slow = 30
ema_filter = 200

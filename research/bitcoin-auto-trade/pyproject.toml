[project]
name = "bitcoin-auto-trade-research"
version = "0.1.0"
description = "Causal HMM regime classification and fixed-strategy perpetual backtests"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<2.5",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "hmmlearn==0.3.3",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9,<4"]

[project.scripts]
btc-research = "trading.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "bitcoin-auto-trade-research"
version = "0.2.0"
description = "Compact causal HMM and fixed-strategy perpetual backtests"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<2.5", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "hmmlearn==0.3.3", "threadpoolctl>=3.5,<4"]

[project.scripts]
btc-research = "trading.run:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
